name: Publish Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read release version
        id: version
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          source = Path('android/app/build.gradle').read_text()
          name = re.search(r"versionName '([A-Za-z0-9][A-Za-z0-9._-]*)'", source).group(1)
          code = int(re.search(r'versionCode (\d+)', source).group(1))
          apk_name = f"WebnovelArchiver-v{name}-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}.apk"
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'name={name}\ncode={code}\ntag=v{name}\n')
              output.write(f'apk_name={apk_name}\n')
          PY

      - name: Check signing secrets and release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          WEBNOVEL_RELEASE_KEYSTORE_BASE64: ${{ secrets.WEBNOVEL_RELEASE_KEYSTORE_BASE64 }}
          WEBNOVEL_RELEASE_STORE_PASSWORD: ${{ secrets.WEBNOVEL_RELEASE_STORE_PASSWORD }}
          WEBNOVEL_RELEASE_KEY_ALIAS: ${{ secrets.WEBNOVEL_RELEASE_KEY_ALIAS }}
          WEBNOVEL_RELEASE_KEY_PASSWORD: ${{ secrets.WEBNOVEL_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          for name in WEBNOVEL_RELEASE_KEYSTORE_BASE64 WEBNOVEL_RELEASE_STORE_PASSWORD WEBNOVEL_RELEASE_KEY_ALIAS WEBNOVEL_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing Actions secret: $name"
              exit 1
            fi
          done
          tags=$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")
          if [[ -n "$tags" ]]; then
            echo "::error::Release tag already exists. Increase versionName and versionCode in android/app/build.gradle."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run quality gate
        run: >-
          android/gradlew -p android :app:lintKotlin :app:releaseCheck
          -x copyDebugApkToProjectRoot --no-daemon

      - name: Build signed release
        env:
          WEBNOVEL_RELEASE_KEYSTORE_BASE64: ${{ secrets.WEBNOVEL_RELEASE_KEYSTORE_BASE64 }}
          WEBNOVEL_RELEASE_STORE_FILE: ${{ runner.temp }}/webnovel-release.jks
          WEBNOVEL_RELEASE_STORE_PASSWORD: ${{ secrets.WEBNOVEL_RELEASE_STORE_PASSWORD }}
          WEBNOVEL_RELEASE_KEY_ALIAS: ${{ secrets.WEBNOVEL_RELEASE_KEY_ALIAS }}
          WEBNOVEL_RELEASE_KEY_PASSWORD: ${{ secrets.WEBNOVEL_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          umask 077
          printf '%s' "$WEBNOVEL_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$WEBNOVEL_RELEASE_STORE_FILE"
          android/gradlew -p android :app:assembleRelease -x copyReleaseApkToProjectRoot --no-daemon

      - name: Verify and package APK
        env:
          APK_NAME: ${{ steps.version.outputs.apk_name }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        shell: bash
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          analyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test "$("$analyzer" manifest application-id "$apk")" = com.vinicius741.webnovelarchiver.nativeapp
          test "$("$analyzer" manifest version-name "$apk")" = "$VERSION_NAME"
          test "$("$analyzer" manifest version-code "$apk")" = "$VERSION_CODE"
          test "$("$analyzer" manifest debuggable "$apk")" = false
          mkdir -p release-assets
          cp "$apk" "release-assets/$APK_NAME"
          cd release-assets
          sha256sum "$APK_NAME" > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          APK_NAME: ${{ steps.version.outputs.apk_name }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Download **$APK_NAME** below on your Android phone and open it to install.

          This is the signed release app. Installing over a copy signed with the same key preserves its data. Do not uninstall the existing app to update.

          Android may ask you to allow installation from your browser. The source-code ZIP and tarball are not app installers.

          Already installed? Open Settings → App Updates in the app to update in place.

          <!-- app-update versionCode=$VERSION_CODE -->
          EOF
          gh release create "$RELEASE_TAG" "release-assets/$APK_NAME" release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Webnovel Archiver $VERSION_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --latest
          printf 'Download: https://github.com/%s/releases/download/%s/%s\n' "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$APK_NAME" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/webnovel-release.jks"
