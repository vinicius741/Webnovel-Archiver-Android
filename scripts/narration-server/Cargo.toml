[package]
name = "narration-server"
version = "2.0.0"
edition = "2021"
description = "Kokoro narration server for Webnovel Archiver: one shared model, memory-aware"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = true
