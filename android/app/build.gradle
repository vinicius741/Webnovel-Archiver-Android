plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jmailen.kotlinter' version '5.7.0'
    id 'io.gitlab.arturbosch.detekt' version '1.23.8'
}

apply from: rootProject.file('gradle/quality.gradle')

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def signingValue = { name ->
    findProperty(name) ?: System.getenv(name) ?: localProperties.getProperty(name)
}
def releaseStoreFile = signingValue('WEBNOVEL_RELEASE_STORE_FILE')
def releaseStorePassword = signingValue('WEBNOVEL_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = signingValue('WEBNOVEL_RELEASE_KEY_ALIAS')
def releaseKeyPassword = signingValue('WEBNOVEL_RELEASE_KEY_PASSWORD')
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

// Beta track: a separate app (own application id, name, icon, and library) published as GitHub
// prereleases. The beta workflow passes its run number as WEBNOVEL_BETA_NUMBER; local beta builds
// default to 0. A beta's versionCode is 1000000 + that number and does not depend on the branch's
// stable versionCode: betas are published from any branch, and a branch cut before a stable bump
// must still produce a higher code than the previous beta. The release workflows read the literal
// `versionCode`/`versionName` lines in defaultConfig, so keep them literal.
def betaNumber = (signingValue('WEBNOVEL_BETA_NUMBER') ?: '0').toString().toInteger()
def betaVersionCode = 1000000 + betaNumber
if (betaNumber < 0 || betaVersionCode > 2100000000) {
    throw new GradleException("WEBNOVEL_BETA_NUMBER must be between 0 and 2099000000, got $betaNumber")
}

android {
    namespace 'com.vinicius741.webnovelarchiver'
    compileSdk 37

    // Observability (Tier 1, T1): Timber logs are gated on BuildConfig.DEBUG in release, so the
    // BuildConfig feature must be on for the variant to generate the class.
    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.vinicius741.webnovelarchiver.nativeapp'
        minSdk 26
        targetSdk 36
        versionCode 24
        versionName '1.0.23-native'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        // Native ABIs are set per build type below, not here: AGP merges defaultConfig and build
        // type abiFilters as a union, so a list here could not be narrowed for release.
        // GitHub repository whose latest release the in-app update check reads (owner/name).
        buildConfigField 'String', 'UPDATE_REPOSITORY', '"vinicius741/Webnovel-Archiver-Android"'
        // Release track the in-app update check follows (appupdate/UpdateChannel); beta overrides it.
        buildConfigField 'String', 'UPDATE_CHANNEL', '"stable"'
        manifestPlaceholders = [deepLinkScheme: 'webnovel-archiver']
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    // The built-in Kokoro voices ship native code (sherpa-onnx + ONNX Runtime), which is almost all
    // of the APK's size. Every build type ships both phone ABIs, arm64 and 32-bit ARM: an APK with
    // native code cannot install on a device matching none of its ABIs, so never drop one of them.
    // Only debug and instrumentation, the builds that run on the x86_64 emulator, also ship x86_64;
    // that one ABI is about 23 MB. Release and beta are phone builds and leave it out.
    def phoneAbis = ['arm64-v8a', 'armeabi-v7a']
    def emulatorAbis = phoneAbis + ['x86_64']

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            ndk { abiFilters(*emulatorAbis) }
        }
        // Instrumentation launches the real application, so give it a separate data sandbox. This
        // keeps connected tests from reading, clearing, or overwriting the user's emulator library.
        instrumentation {
            initWith debug
            applicationIdSuffix '.instrumentation'
            matchingFallbacks = ['debug']
            ndk { abiFilters(*emulatorAbis) }
        }
        release {
            ndk { abiFilters(*phoneAbis) }
            minifyEnabled true
            shrinkResources true
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        // The beta app: the release build (minified, release-signed) under its own application id,
        // so it installs beside the stable app with a separate library. Its name and icon live in
        // src/beta/res; it reuses the release-only sources (src/release/java).
        beta {
            initWith release
            applicationIdSuffix '.beta'
            versionNameSuffix "-beta.$betaNumber"
            matchingFallbacks = ['release']
            ndk { abiFilters(*phoneAbis) }
            buildConfigField 'String', 'UPDATE_CHANNEL', '"beta"'
            // A distinct deep-link scheme keeps links from asking which of the two apps to open.
            manifestPlaceholders = [deepLinkScheme: 'webnovel-archiver-beta']
        }
    }

    packaging {
        jniLibs {
            // sherpa-onnx's Kotlin API loads only libsherpa-onnx-jni.so, which links only
            // libonnxruntime.so. The C and C++ API libraries in its AAR are for native callers and
            // nothing loads them: about 4.7 MB per ABI. Check `readelf -d libsherpa-onnx-jni.so`
            // (NEEDED) and the AAR's System.loadLibrary call before relying on this after an upgrade.
            excludes += ['**/libsherpa-onnx-c-api.so', '**/libsherpa-onnx-cxx-api.so']
            // Store the native libraries compressed (extractNativeLibs=true) rather than page-aligned
            // and uncompressed. They deflate to about 35-50%, which roughly halves the download from
            // GitHub releases; in exchange, install unpacks them to the app's lib directory, so the
            // installed footprint is about the same and install takes a moment longer.
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        instrumentation {
            java.srcDir 'src/debug/java'
            assets.srcDir 'src/debug/assets'
        }
        beta {
            java.srcDir 'src/release/java'
        }
        test.resources.srcDir 'src/debug/assets'
    }

    testBuildType 'instrumentation'

    // Full Android lint (lintDebug) runs in :app:releaseCheck via the Quality Gate workflow on every
    // push to main, so skip the duplicate lintVital pass that would otherwise slow assembleRelease.
    lint {
        checkReleaseBuilds false
    }
}

androidComponents {
    onVariants(selector().withBuildType('beta')) { variant ->
        variant.outputs.each { output -> output.versionCode.set(betaVersionCode) }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

// Tooling recommendations: detekt (maintainability/complexity checks) + kotlinter (format).
// Existing detekt findings live in detekt-baseline.xml, so only new findings fail the build and
// its output lists only them. Fixing a baselined finding? Delete its <ID> line from the baseline.
detekt {
    buildUponDefaultConfig = true
    allRules = false
    config = files("$projectDir/detekt.yml")
    baseline = file("$projectDir/detekt-baseline.xml")
    parallel = true
}

// Keep every resolvable application configuration reproducible. Update the committed lock state
// intentionally with `./gradlew :app:dependencies --write-locks` when dependencies change.
dependencyLocking {
    lockAllConfigurations()
}

// Per-change local gate: formatting, unit tests, static analysis, and debug build.
tasks.register('ci') {
    group = 'verification'
    description = 'Runs the per-change local verification gate.'
    dependsOn 'lintKotlin', 'testInstrumentationUnitTest', 'detekt', 'assembleDebug'
}

// Release gate: everything in ci plus the slower, rarely failing checks (Android lint is the most
// memory-hungry step; the file-size cap overlaps detekt's size rules). The Quality Gate workflow runs
// it on every push to main; the release workflow does not wait on it.
tasks.register('releaseCheck') {
    group = 'verification'
    description = 'Runs the ci gate plus Android lint and the Kotlin file-size cap.'
    dependsOn 'ci', 'checkKotlinFileSize', 'lintDebug'
}

dependencies {
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.activity:activity-ktx:1.13.0'
    // lifecycle-runtime-ktx provides lifecycleScope used by MainActivity (M3 lifecycle-aware scopes)
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    // Browser-powered in-app navigation; required for secure third-party OAuth flows.
    implementation 'androidx.browser:browser:1.10.0'
    // androidx.media — MediaSessionCompat + MediaStyle + MediaButtonReceiver for the TTS foreground
    // service's lock-screen / system media UI and headset/Bluetooth media-button handling
    // (parity gaps 1 & 2; same artifact/version the legacy tts-media-session module used).
    implementation 'androidx.media:media:1.8.0'
    // RecyclerView — recycles views for the Details chapter list and other long lists (Speed S1).
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    // ViewPager2 — swipe-between-tabs pager in the Library (closes the legacy RN PagerView parity gap).
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    // MPAndroidChart — line charts on the per-novel Trends screen (score/Patreon over time). Only
    // published on JitPack (see settings.gradle); MPChartLib is the Android Views module.
    implementation 'com.github.PhilJay.MPAndroidChart:MPChartLib:v4.0.1'
    // Jetpack WindowManager — used by FoldTracker to detect a foldable's hinge/inner display so the
    // responsive layout (size classes, multi-column library, two-pane details) adapts on fold/unfold.
    implementation 'androidx.window:window:1.5.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    // Timber — structured logging (Observability; Tier 1, T1). Plant a DebugTree in debug builds so
    // every catch block and download/TTS state transition is diagnosable from logcat without forcing
    // exceptions into user-facing toasts.
    implementation 'com.jakewharton.timber:timber:5.0.1'
    implementation 'com.squareup.okhttp3:okhttp:5.5.1'
    implementation 'org.jsoup:jsoup:1.24.1'
    implementation 'com.google.code.gson:gson:2.15.0'
    // Coil 3 — image loading with memory/disk cache, downsampling, cancellation (Speed S4).
    // Coil 3 split network support into its own artifact, so coil-network-okhttp is required to load
    // remote cover URLs.
    implementation 'io.coil-kt.coil3:coil:3.6.3'
    implementation 'io.coil-kt.coil3:coil-network-okhttp:3.6.3'
    // sherpa-onnx — runs the built-in Kokoro neural voices on the device (GitHub release AAR, see
    // settings.gradle). Its Kotlin config classes are read by JNI, so proguard-rules.pro keeps them.
    implementation 'com.k2fsa:sherpa-onnx:1.12.21@aar'
    // Commons Compress — unpacks the Kokoro model, published only as a .tar.bz2.
    implementation 'org.apache.commons:commons-compress:1.28.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:5.5.1'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0'
    // Real org.json for JVM unit tests: the android.jar org.json classes are stubs that throw
    // "not mocked", which would leave WebView poll-payload decoding untestable on the JVM.
    testImplementation 'org.json:json:20260814'
    androidTestImplementation 'androidx.test:core-ktx:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit-ktx:1.3.0'
}

tasks.register('copyDebugApkToProjectRoot', Copy) {
    from layout.buildDirectory.file('outputs/apk/debug/app-debug.apk')
    into rootProject.layout.projectDirectory.dir('../apk-output')
    rename { 'WebnovelArchiver-Test-debug.apk' }
}

tasks.register('copyReleaseApkToProjectRoot', Copy) {
    from layout.buildDirectory.file('outputs/apk/release/app-release.apk')
    into rootProject.layout.projectDirectory.dir('../apk-output')
    rename { 'WebnovelArchiver-Native-release.apk' }
    onlyIf { hasReleaseSigning }
}

tasks.register('requireReleaseSigning') {
    doLast {
        if (!hasReleaseSigning) {
            throw new GradleException('Release signing is not configured. Set WEBNOVEL_RELEASE_STORE_FILE, WEBNOVEL_RELEASE_STORE_PASSWORD, WEBNOVEL_RELEASE_KEY_ALIAS, and WEBNOVEL_RELEASE_KEY_PASSWORD.')
        }
    }
}

afterEvaluate {
    tasks.named('assembleDebug') {
        finalizedBy 'copyDebugApkToProjectRoot'
    }
    tasks.named('preReleaseBuild') {
        dependsOn 'requireReleaseSigning'
    }
    tasks.named('preBetaBuild') {
        dependsOn 'requireReleaseSigning'
    }
    tasks.named('assembleRelease') {
        finalizedBy 'copyReleaseApkToProjectRoot'
    }
}
